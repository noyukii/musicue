name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: MusiCue-macOS.zip
            notes: true
          - os: windows-latest
            artifact: MusiCue-Windows.zip
            notes: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build -j8

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="build/MusiCue_artefacts/Release/MusiCue.app"
          # Ad-hoc sign so the bundle is a valid Mach-O image. A Developer ID
          # + notarization would be needed to skip Gatekeeper entirely.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"

          STAGE="${RUNNER_TEMP}/musicue-macos"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/MusiCue.app"
          cat > "$STAGE/If macOS says MusiCue is damaged, open this.command" << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          xattr -cr "MusiCue.app"
          open "MusiCue.app"
          EOF
          chmod +x "$STAGE/"*.command
          ditto -c -k "$STAGE" "${{ matrix.artifact }}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DBUILD_TESTING=OFF

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release -j8

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/MusiCue_artefacts/Release/MusiCue.exe -DestinationPath "${{ matrix.artifact }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: ${{ matrix.notes }}
