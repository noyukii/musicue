<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Download MusiCue releases for macOS and Windows.">
    <title>MusiCue — Downloads</title>
    <style>
        :root {
            color-scheme: dark;
            --canvas: #242424;
            --panel: #2b2b2b;
            --field: #1e1e1e;
            --line: #3d3d3d;
            --text: #d9d9d9;
            --muted: #a5a5a5;
            --faint: #777777;
            --ready: #43d158;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: var(--canvas);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100% - 40px, 960px);
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(230px, .82fr) minmax(390px, 1.18fr);
            border-inline: 1px solid var(--line);
        }

        .identity {
            min-height: 700px;
            padding: 52px 38px 38px;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-right: 1px solid var(--line);
        }

        .app-icon {
            width: 88px;
            height: 88px;
            display: block;
            border-radius: 20px;
        }

        .brand {
            margin-top: 82px;
        }

        .wordmark, .release-kicker, .file-meta, .footer {
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .wordmark {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 750;
        }

        .tagline {
            max-width: 14rem;
            margin: 9px 0 0;
            color: var(--muted);
            font-size: .96rem;
            line-height: 1.55;
        }

        .releases {
            padding: 52px;
        }

        .release-kicker {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: .7rem;
            font-weight: 750;
        }

        h1 {
            margin: 0 0 34px;
            font-size: clamp(2rem, 5vw, 3rem);
            letter-spacing: -.03em;
            line-height: 1;
        }

        .release-list {
            display: grid;
            gap: 16px;
        }

        .release {
            padding: 0 20px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 14px;
        }

        .release-summary {
            padding: 22px 0 19px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
        }

        .release-version {
            font-size: 1.1rem;
            font-weight: 750;
        }

        .release-date {
            color: var(--muted);
            font-size: .82rem;
            white-space: nowrap;
        }

        .files {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .file + .file { border-top: 1px solid var(--line); }

        .file a {
            min-height: 64px;
            padding: 13px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            color: var(--text);
            text-decoration: none;
            transition: color 120ms ease;
        }

        .file a:hover { color: var(--ready); }

        .file-name { font-size: .96rem; font-weight: 650; }

        .file-meta {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: .65rem;
            font-weight: 750;
        }

        .footer {
            margin: 38px 0 0;
            color: var(--muted);
            font-size: .67rem;
        }

        .footer a { color: inherit; }

        a:focus-visible {
            outline: 3px solid var(--ready);
            outline-offset: 3px;
        }

        @media (max-width: 680px) {
            main {
                width: 100%;
                display: block;
                border: 0;
            }

            .identity { min-height: 0; padding: 34px 26px; border-right: 0; border-bottom: 1px solid var(--line); }
            .app-icon { width: 64px; height: 64px; border-radius: 15px; }
            .brand { margin-top: 34px; }
            .releases { padding: 40px 26px; }
            h1 { margin-bottom: 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .file a { transition: none; }
        }
    </style>
</head>
<body>
    <main>
        <aside class="identity" aria-label="MusiCue">
            <img class="app-icon" src="assets/appicon_musicue.png" alt="MusiCue app icon">
            <div class="brand">
                <p class="wordmark">MusiCue</p>
                <p class="tagline">Audio show control for your cues and workspaces.</p>
            </div>
        </aside>

        <section class="releases" aria-labelledby="page-title">
            <h1 id="page-title">Releases</h1>
            <div class="release-list">
                <article class="release" aria-labelledby="release-v010">
                    <div class="release-summary">
                        <span class="release-version" id="release-v010">v0.1.0</span>
                        <time class="release-date" datetime="2026-08-18">18 Aug 2026</time>
                    </div>
                    <ul class="files" aria-label="v0.1.0 downloads">
                        <li class="file">
                            <a href="https://github.com/noyukii/musicue/releases/download/v0.1.0/MusiCue-macOS.zip">
                                <span class="file-name">MusiCue-macOS.zip</span>
                                <span class="file-meta">3.8 MB</span>
                            </a>
                        </li>
                        <li class="file">
                            <a href="https://github.com/noyukii/musicue/releases/download/v0.1.0/MusiCue-Windows.zip">
                                <span class="file-name">MusiCue-Windows.zip</span>
                                <span class="file-meta">3.7 MB</span>
                            </a>
                        </li>
                    </ul>
                </article>
            </div>
            <p class="footer"><a href="https://github.com/noyukii/musicue/releases">All releases on GitHub</a></p>
        </section>
    </main>
</body>
</html>
