<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Download MusiCue, an audio show-control app for macOS.">
    <title>MusiCue — Download</title>
    <style>
        :root {
            color-scheme: dark;
            --canvas: #242424;
            --panel: #2b2b2b;
            --field: #1e1e1e;
            --line: #3d3d3d;
            --text: #d9d9d9;
            --muted: #8e8e8e;
            --go: #a9a5ba;
            --go-text: #26262a;
            --ready: #43d158;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: var(--canvas);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100% - 40px, 960px);
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(220px, 0.82fr) minmax(360px, 1.18fr);
            border-inline: 1px solid var(--line);
        }

        .identity {
            padding: 52px 38px 38px;
            background: var(--panel);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
        }

        .app-mark {
            width: 82px;
            height: 82px;
            object-fit: contain;
            margin-bottom: 28px;
        }

        .wordmark, .eyebrow, .details dt, .footer {
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .wordmark {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .tagline {
            max-width: 13rem;
            margin: 8px 0 0;
            color: var(--muted);
            font-size: .95rem;
            line-height: 1.55;
        }

        .signal {
            margin-top: auto;
            padding-top: 64px;
            display: flex;
            align-items: end;
            gap: 5px;
            height: 122px;
        }

        .signal span {
            width: 7px;
            border-radius: 7px;
            background: var(--ready);
            opacity: .9;
        }

        .signal span:nth-child(1), .signal span:nth-child(7) { height: 17px; }
        .signal span:nth-child(2), .signal span:nth-child(6) { height: 39px; }
        .signal span:nth-child(3), .signal span:nth-child(5) { height: 67px; }
        .signal span:nth-child(4) { height: 94px; }

        .download {
            padding: 52px 52px 38px;
            display: flex;
            flex-direction: column;
        }

        .eyebrow {
            margin: 0 0 17px;
            color: var(--muted);
            font-size: .72rem;
            font-weight: 700;
        }

        h1 {
            max-width: 8ch;
            margin: 0;
            font-size: clamp(2.85rem, 7vw, 5.25rem);
            font-weight: 750;
            letter-spacing: -.065em;
            line-height: .9;
        }

        .intro {
            max-width: 29rem;
            margin: 27px 0 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.65;
        }

        .release {
            margin-top: 44px;
            padding: 22px;
            background: var(--field);
            border: 1px solid var(--line);
        }

        .release-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .release h2 {
            margin: 0;
            font-size: 1.05rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: .8rem;
            white-space: nowrap;
        }

        .status::before {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ready);
            content: "";
        }

        .button {
            display: block;
            padding: 14px 16px;
            background: var(--go);
            color: var(--go-text);
            font-weight: 750;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
            transition: background-color 120ms ease, transform 120ms ease;
        }

        .button:hover { background: #bfbbd1; transform: translateY(-1px); }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin: 24px 0 0;
        }

        .details div { min-width: 0; }

        .details dt {
            margin-bottom: 5px;
            color: var(--muted);
            font-size: .67rem;
            font-weight: 700;
        }

        .details dd {
            margin: 0;
            font-size: .9rem;
        }

        .footer {
            margin-top: auto;
            padding-top: 52px;
            color: var(--muted);
            font-size: .68rem;
        }

        .footer a { color: inherit; }

        a:focus-visible {
            outline: 3px solid var(--ready);
            outline-offset: 3px;
        }

        @media (max-width: 680px) {
            main {
                width: 100%;
                display: block;
                border: 0;
            }

            .identity, .download { padding: 32px 24px; }
            .identity { border-right: 0; border-bottom: 1px solid var(--line); }
            .app-mark { width: 58px; height: 58px; margin-bottom: 18px; }
            .tagline { max-width: none; }
            .signal { display: none; }
            h1 { font-size: clamp(3rem, 16vw, 4.6rem); }
            .release { margin-top: 32px; }
            .footer { margin-top: 0; padding-top: 36px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .button { transition: none; }
            .button:hover { transform: none; }
        }
    </style>
</head>
<body>
    <main>
        <aside class="identity" aria-label="MusiCue">
            <img class="app-mark" src="../Assets/appicon/appicon_musicue.png" alt="MusiCue app icon">
            <p class="wordmark">MusiCue</p>
            <p class="tagline">Audio show control for your cues and workspaces.</p>
            <div class="signal" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
        </aside>

        <section class="download" aria-labelledby="page-title">
            <p class="eyebrow">MusiCue for macOS</p>
            <h1 id="page-title">Cue the next sound.</h1>
            <p class="intro">Build an audio workspace, arrange your cues, and keep a show ready to run.</p>

            <div class="release">
                <div class="release-top">
                    <h2>Release downloads</h2>
                    <span class="status">GitHub</span>
                </div>
                <a class="button" href="https://github.com/noyukii/musicue/releases">View MusiCue releases</a>
                <dl class="details">
                    <div>
                        <dt>App version</dt>
                        <dd>0.1.0</dd>
                    </div>
                    <div>
                        <dt>Platform</dt>
                        <dd>macOS</dd>
                    </div>
                </dl>
            </div>

            <p class="footer"><a href="https://github.com/noyukii/musicue">View source and release notes on GitHub</a></p>
        </section>
    </main>
</body>
</html>
